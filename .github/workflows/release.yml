name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'sar-release' || format('sar-ci-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, validate and package
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./Tools/CI/Build.ps1 -Tag $env:RELEASE_TAG
      - name: Validate Workshop payload without publishing
        shell: pwsh
        run: |
          ./Tools/CI/PublishWorkshop.ps1 -ArtifactRoot artifacts/ci -DryRun
          ./Tools/CI/Test-Package.ps1 -ArtifactRoot artifacts/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workshop-package
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 30
      - name: Publish readiness
        shell: pwsh
        env:
          STEAM_READY: ${{ vars.STEAM_PUBLISH_ENABLED }}
        run: |
          if ($env:STEAM_READY -ne 'true') {
            'Steam publishing is disabled. Build artifacts are ready; configure steam-workshop secrets and set STEAM_PUBLISH_ENABLED=true before a release tag.' >> $env:GITHUB_STEP_SUMMARY
          }
  github-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workshop-package
          path: package
      - name: Attach the tested package to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content package/manifest.json -Raw | ConvertFrom-Json
          $zip=Join-Path package $m.archive
          if ((Get-FileHash $zip).Hash -cne $m.archiveSha256) { throw 'Release artifact checksum mismatch.' }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zip package/manifest.json package/Description.en.bbcode package/Description.zh-CN.bbcode --clobber
          } else {
            $arguments=@('release','create',$env:RELEASE_TAG,$zip,'package/manifest.json','package/Description.en.bbcode','package/Description.zh-CN.bbcode','--verify-tag','--title',$env:RELEASE_TAG,'--notes-file','package/release-notes.md')
            if ($m.version.Contains('-')) { $arguments+='--prerelease' }
            gh @arguments
          }
          if ($LASTEXITCODE) { throw 'GitHub Release upload failed.' }
  steam-workshop:
    needs: [build, github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.STEAM_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    environment: steam-workshop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workshop-package
          path: package
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Update the existing Workshop item
        shell: pwsh
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        run: ./Tools/CI/PublishWorkshop.ps1 -ArtifactRoot package
